env = LIBVA_DRIVER_NAME,nvidia
env = XDG_SESSION_TYPE,wayland
env = GBM_BACKEND,nvidia-drm
env = __GLX_VENDOR_LIBRARY_NAME,nvidia

debug {
    disable_logs = false
    enable_stdout_logs = true
}

cursor {
    no_hardware_cursors = true
}

source = ~/.config/hypr/hyprlocal.conf
source = ~/.config/hypr/sheffler_windowrules.conf
source = ~/.config/hypr/sheffler_autostart.conf
source = ~/.config/hypr/sheffler_input.conf
source = ~/.config/hypr/sheffler_keybinds.conf
source = ~/.config/hypr/sheffler_scratch.conf
source = ~/.config/hypr/sheffler_deco.conf

dwindle {
    # dwindle:pseudotile was removed in 0.5x; pseudotiling is the pseudo dispatcher
    preserve_split = true
#    smart_split = true
}
master {
    # Commented out due to compatibility reasons
    # new_status = master
}
gestures {
    # gestures:workspace_swipe was replaced by the gesture = syntax in 0.51+
}

# Example for xwayland
# xwayland {
#   force_zero_scaling = true
# }
# qt5ct environment variable
# env = QT_QPA_PLATFORMTHEME,qt5ct

# replaces gestures:workspace_swipe
gesture = 3, horizontal, workspace
